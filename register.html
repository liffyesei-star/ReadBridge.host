<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Daftar - ReadBridge</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "background": "#f8f9ff",
                      "on-background": "#0b1c30",
                      "surface-container-lowest": "#ffffff",
                      "primary": "#004ac6",
                      "on-primary": "#ffffff",
                      "surface-tint": "#0053db",
                      "outline-variant": "#c3c6d7",
                      "on-surface": "#0b1c30",
                      "on-surface-variant": "#434655",
                      "surface-container-low": "#eff4ff",
                      "error": "#ba1a1a",
                      "on-error": "#ffffff"
              },
              "fontFamily": {
                      "sans": ["Plus Jakarta Sans", "sans-serif"]
              }
            }
          }
        }
    </script>
    <style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-background');
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
    </style>
</head>
<body class="antialiased min-h-screen flex items-center justify-center relative overflow-hidden">
    
    <!-- Background Elements -->
    <div class="absolute -top-20 -right-20 w-96 h-96 bg-indigo-500/10 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-20 -left-20 w-96 h-96 bg-blue-500/10 rounded-full blur-3xl pointer-events-none"></div>

    <div class="w-full max-w-md p-6 z-10 animate-fade-in-up">
        <!-- Back Button -->
        <a href="index.html" class="inline-flex items-center gap-2 text-on-surface-variant hover:text-primary transition-colors mb-6 font-medium">
            <span class="material-symbols-outlined text-[20px]">arrow_back</span> Kembali ke Beranda
        </a>

        <!-- Auth Card -->
        <div class="glass-panel rounded-2xl shadow-xl border border-white/50 p-8 sm:p-10 relative overflow-hidden">
            <!-- Decorative line -->
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-indigo-500 to-blue-500"></div>

            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold text-on-surface tracking-tight mb-2">Buat Akun</h1>
                <p class="text-on-surface-variant text-sm">Bergabunglah dengan ribuan pembaca lainnya</p>
            </div>

            <form id="register-form" class="flex flex-col gap-5">
                <div>
                    <label for="name" class="block text-sm font-semibold text-on-surface mb-1.5">Nama Lengkap</label>
                    <div class="relative">
                        <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant">person</span>
                        <input type="text" id="name" required placeholder="Nama Anda" 
                            class="w-full pl-10 pr-4 py-3 bg-surface-container-low border border-outline-variant/50 rounded-xl focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all placeholder:text-outline-variant/70 text-on-surface">
                    </div>
                </div>

                <div>
                    <label for="email" class="block text-sm font-semibold text-on-surface mb-1.5">Email</label>
                    <div class="relative">
                        <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant">mail</span>
                        <input type="email" id="email" required placeholder="nama@email.com" 
                            class="w-full pl-10 pr-4 py-3 bg-surface-container-low border border-outline-variant/50 rounded-xl focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all placeholder:text-outline-variant/70 text-on-surface">
                    </div>
                </div>

                <div>
                    <label for="password" class="block text-sm font-semibold text-on-surface mb-1.5">Kata Sandi</label>
                    <div class="relative">
                        <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant">lock</span>
                        <input type="password" id="password" required placeholder="Min. 8 karakter (huruf & angka)" 
                            class="w-full pl-10 pr-10 py-3 bg-surface-container-low border border-outline-variant/50 rounded-xl focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all placeholder:text-outline-variant/70 text-on-surface"
                            pattern="(?=.*\d)(?=.*[a-zA-Z]).{8,}" title="Minimal 8 karakter, mengandung huruf dan angka">
                        <button type="button" id="toggle-password" class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors">
                            <span class="material-symbols-outlined text-[20px]">visibility</span>
                        </button>
                    </div>
                </div>
                
                <div>
                    <label for="confirm-password" class="block text-sm font-semibold text-on-surface mb-1.5">Konfirmasi Kata Sandi</label>
                    <div class="relative">
                        <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant">lock_reset</span>
                        <input type="password" id="confirm-password" required placeholder="Ulangi kata sandi" 
                            class="w-full pl-10 pr-10 py-3 bg-surface-container-low border border-outline-variant/50 rounded-xl focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all placeholder:text-outline-variant/70 text-on-surface">
                        <button type="button" id="toggle-confirm-password" class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors">
                            <span class="material-symbols-outlined text-[20px]">visibility</span>
                        </button>
                    </div>
                    <p id="password-error" class="text-error text-xs mt-1 font-medium hidden">Kata sandi tidak cocok</p>
                </div>

                <button type="submit" id="btn-register" class="w-full bg-primary text-white font-bold py-3.5 rounded-xl hover:bg-surface-tint hover:shadow-lg hover:-translate-y-0.5 transition-all mt-2 flex items-center justify-center gap-2">
                    Daftar Sekarang
                </button>
            </form>

            <!-- Divider -->
            <div class="relative flex py-5 items-center">
                <div class="flex-grow border-t border-outline-variant/40"></div>
                <span class="flex-shrink-0 mx-4 text-on-surface-variant text-sm font-medium">atau daftar dengan</span>
                <div class="flex-grow border-t border-outline-variant/40"></div>
            </div>

            <!-- Google Register Button -->
            <button id="btn-google" class="w-full bg-white border border-outline-variant/50 text-on-surface font-semibold py-3 rounded-xl hover:bg-surface-container-low transition-all flex items-center justify-center gap-3 shadow-sm">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.15v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.15C1.43 8.55 1 10.22 1 12s.43 3.45 1.15 4.93l3.69-2.84z" fill="#FBBC05"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.15 7.07l3.69 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                </svg>
                <span>Google</span>
            </button>

            <div class="mt-8 text-center text-sm text-on-surface-variant">
                Sudah punya akun? <a href="login.html" class="font-bold text-primary hover:underline ml-1">Masuk di sini</a>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (window.Auth && window.Auth.redirectIfLoggedIn) {
                window.Auth.redirectIfLoggedIn();
            }

            const form = document.getElementById('register-form');
            const togglePasswordBtn = document.getElementById('toggle-password');
            const passwordInput = document.getElementById('password');
            
            const toggleConfirmPasswordBtn = document.getElementById('toggle-confirm-password');
            const confirmPasswordInput = document.getElementById('confirm-password');
            const passwordError = document.getElementById('password-error');

            togglePasswordBtn.addEventListener('click', () => {
                const type = passwordInput.type === 'password' ? 'text' : 'password';
                passwordInput.type = type;
                togglePasswordBtn.innerHTML = `<span class="material-symbols-outlined text-[20px]">${type === 'password' ? 'visibility' : 'visibility_off'}</span>`;
            });
            
            toggleConfirmPasswordBtn.addEventListener('click', () => {
                const type = confirmPasswordInput.type === 'password' ? 'text' : 'password';
                confirmPasswordInput.type = type;
                toggleConfirmPasswordBtn.innerHTML = `<span class="material-symbols-outlined text-[20px]">${type === 'password' ? 'visibility' : 'visibility_off'}</span>`;
            });

            form.addEventListener('submit', (e) => {
                e.preventDefault();
                
                const name = document.getElementById('name').value.trim();
                const email = document.getElementById('email').value.trim();
                const password = passwordInput.value;
                const confirmPassword = confirmPasswordInput.value;
                const btn = document.getElementById('btn-register');
                
                if (password !== confirmPassword) {
                    passwordError.classList.remove('hidden');
                    confirmPasswordInput.focus();
                    return;
                }
                
                passwordError.classList.add('hidden');

                if (window.Auth) {
                    window.Auth.register(name, email, password, btn);
                }
            });
        });
    </script>

    <script type="module">
        import { signInWithGoogle } from './js/firebase-auth.js';

        document.getElementById('btn-google').addEventListener('click', async () => {
            const btn = document.getElementById('btn-google');
            const originalText = btn.innerHTML;
            btn.innerHTML = `<span class="material-symbols-outlined animate-spin">progress_activity</span> Memproses...`;
            btn.disabled = true;

            try {
                // 1. Dapatkan token Firebase dari popup
                const firebaseToken = await signInWithGoogle();
                
                // 2. Kirim ke backend untuk daftar/login & dapat JWT Lokal
                if (window.Auth && window.Auth.googleLogin) {
                    await window.Auth.googleLogin(firebaseToken);
                    alert("Pendaftaran/Login dengan Google Berhasil!");
                    window.location.href = "index.html";
                }
            } catch (error) {
                alert("Google Auth Gagal: " + (error.message || "Batal/Error"));
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
