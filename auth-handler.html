<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ReadBridge — Login Google</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font: 500 15px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f8fafc;
      color: #0f172a;
    }
    .box { text-align: center; max-width: 380px; width: 90%; padding: 32px 24px; background: #ffffff; border-radius: 20px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; }
    .spin {
      width: 44px; height: 44px; margin: 0 auto 20px;
      border: 4px solid #2563eb;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    a, button.link {
      color: #2563eb;
      background: none;
      border: none;
      font: inherit;
      cursor: pointer;
      text-decoration: underline;
    }
    .btn {
      display: inline-block;
      margin-top: 16px;
      padding: 12px 24px;
      background: #2563eb;
      color: #fff;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 600;
      transition: background 0.2s;
    }
    .btn:hover { background: #1d4ed8; }
    .err { color: #dc2626; font-size: 13px; margin-top: 14px; line-height: 1.5; white-space: pre-line; }
  </style>

  <!-- Firebase Compat SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <!-- New modular redirect handler -->
  <script type="module" src="js/auth/redirect-handler.js"></script>
</head>
<body>
  <div class="box">
    <div class="spin" id="spin"></div>
    <p id="rb-auth-status">Memuat...</p>
    <p class="err" id="rb-auth-error" hidden></p>
    <div id="rb-done" hidden>
      <a class="btn" id="rb-continue-btn" href="eksplor.html">Lanjut ke ReadBridge</a>
    </div>
    <p style="font-size:12px;margin-top:24px;color:#64748b">
      <a href="login.html">← Kembali ke login</a>
      ·
      <button type="button" class="link" onclick="location.href='login.html'">Coba Popup (Chrome)</button>
    </p>
  </div>
</body>
</html>
