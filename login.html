<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Masuk - ReadBridge</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "background": "#f8f9ff",
                      "on-background": "#0b1c30",
                      "surface-container-lowest": "#ffffff",
                      "primary": "#004ac6",
                      "on-primary": "#ffffff",
                      "surface-tint": "#0053db",
                      "outline-variant": "#c3c6d7",
                      "on-surface": "#0b1c30",
                      "on-surface-variant": "#434655",
                      "surface-container-low": "#eff4ff",
                      "error": "#ba1a1a",
                      "on-error": "#ffffff"
              },
              "fontFamily": {
                      "sans": ["Plus Jakarta Sans", "sans-serif"]
              }
            }
          }
        }
    </script>
    <style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-background');
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
    </style>
</head>
<body class="antialiased min-h-screen flex items-center justify-center relative overflow-hidden">
    
    <!-- Background Elements -->
    <div class="absolute -top-20 -left-20 w-96 h-96 bg-blue-500/10 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-20 -right-20 w-96 h-96 bg-indigo-500/10 rounded-full blur-3xl pointer-events-none"></div>

    <div class="w-full max-w-md p-6 z-10 animate-fade-in-up">
        <!-- Back Button -->
        <a href="index.html" class="inline-flex items-center gap-2 text-on-surface-variant hover:text-primary transition-colors mb-6 font-medium">
            <span class="material-symbols-outlined text-[20px]">arrow_back</span> Kembali ke Beranda
        </a>

        <!-- Auth Card -->
        <div class="glass-panel rounded-2xl shadow-xl border border-white/50 p-8 sm:p-10 relative overflow-hidden">
            <!-- Decorative line -->
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-blue-500 to-indigo-500"></div>

            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold text-on-surface tracking-tight mb-2">Selamat Datang</h1>
                <p class="text-on-surface-variant text-sm">Masuk untuk melanjutkan ke ReadBridge</p>
            </div>

            <form id="login-form" class="flex flex-col gap-5">
                <div>
                    <label for="email" class="block text-sm font-semibold text-on-surface mb-1.5">Email</label>
                    <div class="relative">
                        <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant">mail</span>
                        <input type="email" id="email" required placeholder="nama@email.com" 
                            class="w-full pl-10 pr-4 py-3 bg-surface-container-low border border-outline-variant/50 rounded-xl focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all placeholder:text-outline-variant/70 text-on-surface">
                    </div>
                </div>

                <div>
                    <label for="password" class="block text-sm font-semibold text-on-surface mb-1.5">Kata Sandi</label>
                    <div class="relative">
                        <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant">lock</span>
                        <input type="password" id="password" required placeholder="••••••••" 
                            class="w-full pl-10 pr-10 py-3 bg-surface-container-low border border-outline-variant/50 rounded-xl focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all placeholder:text-outline-variant/70 text-on-surface">
                        <button type="button" id="toggle-password" class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors">
                            <span class="material-symbols-outlined text-[20px]">visibility</span>
                        </button>
                    </div>
                    <div class="flex justify-end mt-2">
                        <a href="reset-password.html" class="text-sm font-semibold text-primary hover:underline">Lupa kata sandi?</a>
                    </div>
                </div>

                <button type="submit" id="btn-login" class="w-full bg-primary text-white font-bold py-3.5 rounded-xl hover:bg-surface-tint hover:shadow-lg hover:-translate-y-0.5 transition-all mt-2 flex items-center justify-center gap-2">
                    Masuk Sekarang
                </button>
            </form>

            <div class="mt-8 text-center text-sm text-on-surface-variant">
                Belum punya akun? <a href="register.html" class="font-bold text-primary hover:underline ml-1">Daftar di sini</a>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Redirect if already logged in
            if (window.Auth && window.Auth.redirectIfLoggedIn) {
                window.Auth.redirectIfLoggedIn();
            }

            const form = document.getElementById('login-form');
            const togglePasswordBtn = document.getElementById('toggle-password');
            const passwordInput = document.getElementById('password');

            togglePasswordBtn.addEventListener('click', () => {
                const type = passwordInput.type === 'password' ? 'text' : 'password';
                passwordInput.type = type;
                togglePasswordBtn.innerHTML = `<span class="material-symbols-outlined text-[20px]">${type === 'password' ? 'visibility' : 'visibility_off'}</span>`;
            });

            form.addEventListener('submit', (e) => {
                e.preventDefault();
                const email = document.getElementById('email').value.trim();
                const password = passwordInput.value;
                const btn = document.getElementById('btn-login');

                if (window.Auth) {
                    window.Auth.login(email, password, btn);
                }
            });
        });
    </script>
</body>
</html>
